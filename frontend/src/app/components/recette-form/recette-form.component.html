<div class="container">
  <h2>{{ recetteId ? 'Modifier' : 'Ajouter' }} une recette</h2>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <form (ngSubmit)="onSubmit()" #form="ngForm">
    <div class="form-group">
      <label for="name">Nom *</label>
      <input
        type="text"
        id="name"
        [(ngModel)]="recette.name"
        name="name"
        class="form-control"
        required
      />
    </div>

    <div class="form-group">
      <label for="description">Description *</label>
      <textarea
        id="description"
        [(ngModel)]="recette.description"
        name="description"
        class="form-control"
        rows="4"
        required
      ></textarea>
    </div>

    <div class="form-group">
      <label for="category">Catégorie *</label>
      <select
        id="category"
        [(ngModel)]="recette.category"
        name="category"
        class="form-control"
        required
      >
        <option value="">Sélectionner une catégorie</option>
        <option *ngFor="let cat of categories" [value]="cat._id">
          {{ cat.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="difficulty">Difficulté</label>
      <select
        id="difficulty"
        [(ngModel)]="recette.difficulty"
        name="difficulty"
        class="form-control"
      >
        <option value="facile">Facile</option>
        <option value="moyen">Moyen</option>
        <option value="difficile">Difficile</option>
      </select>
    </div>

    <div class="form-group">
      <label for="ingredients">Ingrédients (séparés par des virgules)</label>
      <textarea
        id="ingredients"
        [(ngModel)]="recette.ingredients"
        name="ingredients"
        class="form-control"
        rows="3"
        placeholder="ex: Tomate, Oignon, Ail"
      ></textarea>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
      <a routerLink="/" class="btn btn-secondary">Annuler</a>
    </div>
  </form>
</div>
